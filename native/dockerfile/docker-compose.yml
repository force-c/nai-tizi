services:
  api:
    build:
      context: ..
      dockerfile: dockerfile/Dockerfile
    ports:
      - "9009:9009"
    environment:
      QUICK_ADMIN_APP_ENV: dev
      QUICK_ADMIN_SERVER_PORT: 9009
      QUICK_ADMIN_DATABASE_DSN: "host=postgres user=postgres password=${QUICK_ADMIN_POSTGRES_PASSWORD:?set QUICK_ADMIN_POSTGRES_PASSWORD} dbname=quick_admin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      QUICK_ADMIN_REDIS_ADDR: redis:6379
      QUICK_ADMIN_REDIS_PASSWORD: ""
      QUICK_ADMIN_JWT_SECRET: "${QUICK_ADMIN_JWT_SECRET:?set QUICK_ADMIN_JWT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quick-admin
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${QUICK_ADMIN_POSTGRES_PASSWORD:?set QUICK_ADMIN_POSTGRES_PASSWORD}"
      POSTGRES_DB: quick_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quick_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - quick-admin
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - quick-admin
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  quick-admin:
    name: quick-admin-network
