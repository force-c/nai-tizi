x-application-environment: &application-environment
  LIGHTNING_APP_ENV: prod
  LIGHTNING_DATABASE_DSN: "host=postgres user=postgres password=${LIGHTNING_POSTGRES_PASSWORD:-post123} dbname=quick_admin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  LIGHTNING_REDIS_ADDR: redis:6379
  LIGHTNING_REDIS_PASSWORD: "${LIGHTNING_REDIS_PASSWORD:-123456}"
  LIGHTNING_JWT_SECRET: "${LIGHTNING_JWT_SECRET:?set LIGHTNING_JWT_SECRET}"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "9009:9009"
    environment:
      <<: *application-environment
      LIGHTNING_SERVER_PORT: 9009
      LIGHTNING_S3_ENABLED: "true"
      LIGHTNING_S3_ENDPOINT: rustfs:9000
      LIGHTNING_S3_ACCESS_KEY_ID: "${LIGHTNING_RUSTFS_ACCESS_KEY:-rustfsadmin}"
      LIGHTNING_S3_SECRET_ACCESS_KEY: "${LIGHTNING_RUSTFS_SECRET_KEY:-rustfsadmin}"
      LIGHTNING_S3_REGION: us-east-1
      LIGHTNING_S3_BUCKET: "${LIGHTNING_RUSTFS_BUCKET:-quick-admin}"
      LIGHTNING_S3_USE_SSL: "false"
      LIGHTNING_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9009/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      LIGHTNING_APP_ENV: prod
      LIGHTNING_DATABASE_DSN: "host=postgres user=postgres password=${LIGHTNING_POSTGRES_PASSWORD:-post123} dbname=quick_admin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LIGHTNING_POSTGRES_PASSWORD:-post123}"
      POSTGRES_DB: quick_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quick_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${LIGHTNING_REDIS_PASSWORD:-123456}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${LIGHTNING_REDIS_PASSWORD:-123456}' ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${LIGHTNING_RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${LIGHTNING_RUSTFS_SECRET_KEY:-rustfsadmin}"
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rustfs-volume-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
