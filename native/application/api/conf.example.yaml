server:
  port: 9009

database:
  dsn: "host=127.0.0.1 user=postgres password=post123 dbname=quick_admin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetimeMinutes: 60
  slowThreshold: 500

redis:
  addr: "127.0.0.1:6379"
  password: "123456"
  db: 0

jwt:
  secret: "replace-with-at-least-32-random-characters"
  expire: 7200

auth:
  tokenHeader: "Authorization"
  allowConcurrent: false

cors:
  enabled: false

rabbitmq:
  enabled: false
  url: "amqp://guest:guest@127.0.0.1:5672/"

s3:
  enabled: false
  endpoint: "127.0.0.1:9000"
  accessKeyId: "rustfsadmin"
  secretAccessKey: "rustfsadmin"
  region: "us-east-1"
  bucket: "quick-admin"
  useSSL: false
  forcePathStyle: true

websocket:
  enabled: true
  timeoutEnabled: true
  readTimeoutSeconds: 60
  writeTimeoutSeconds: 10
  heartbeatEnabled: true
  maxReadTimeouts: 3
