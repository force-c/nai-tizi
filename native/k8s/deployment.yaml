apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-admin-api
  labels:
    app: quick-admin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quick-admin-api
  template:
    metadata:
      labels:
        app: quick-admin-api
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: ghcr.io/your-org/quick-admin:0.1.0
          ports:
            - containerPort: 9009
              name: http
          env:
            - name: QUICK_ADMIN_APP_ENV
              value: prod
            - name: QUICK_ADMIN_SERVER_PORT
              value: "9009"
            - name: QUICK_ADMIN_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: quick-admin-secret
                  key: database-dsn
            - name: QUICK_ADMIN_REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: quick-admin-config
                  key: redis-addr
            - name: QUICK_ADMIN_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quick-admin-secret
                  key: redis-password
            - name: QUICK_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quick-admin-secret
                  key: jwt-secret
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
